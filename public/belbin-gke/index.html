strict control-plane access with authorized networks/private endpoint as appropriate. Use NetworkPolicy (default deny, explicit namespace/service paths), separate namespaces and service accounts, and Workload Identity. Reserve IP ranges and quotas for pods/services; monitor NAT ports, conntrack, IP utilization, and load-balancer capacity.\n\n## Data tier\nPrefer a regional managed relational database (for example Cloud SQL HA) with synchronous standby across zones, automatic backups, point-in-time recovery, encryption, maintenance windows, and tested failover. Applications connect through a managed connector/proxy and use bounded pools, backoff, circuit breakers, and transaction timeouts. Database sizing, connection limits, replica lag, storage, and failover time are load-tested; schema migrations are backward-compatible and separately rolled out. A cross-region read replica or managed cross-region replica is maintained for DR, with documented promotion and an explicitly accepted RPO (for example, 5 minutes) and RTO (for example, 60 minutes).\n\nUse a managed regional message queue with replicated durability and at-least-once semantics. Consumers are idempotent, acknowledge only after durable processing, use dead-letter queues, bounded retries/backoff, and alert on age/lag. Replicate/export queue configuration and define the DR message RPO; do not claim exactly-once delivery.\n\n## Availability and failure behavior\nA zonal node/VM failure causes rescheduling in other zones; a zone outage leaves two zones serving traffic. Health checks remove failed pods/nodes, and autoscaling replenishes capacity. Pod topology rules, sufficient spare capacity, regional database HA, and regional queue durability are prerequisites; verify quota can create replacement nodes in surviving zones. During a zone event, capacity may be reduced and noncritical workloads are shed before customer traffic.\n\nFor a regional outage, declare DR using the runbook: confirm incident, freeze writes/deployments, promote the database replica, validate queue state/configuration, scale the DR cluster, switch load-balancer/DNS traffic, and verify key user journeys. Route only after database promotion and application readiness. Record start/end times and reconcile data after recovery. Target RTO 60 minutes and RPO 5 minutes (business must approve these). Failback is a separate planned change, not an automatic action.\n\n## Upgrades and operations\nUse release channels and a nonproduction environment that mirrors production. Apply GKE/node upgrades progressively: canary pool, one zone at a time, surge upgrades, maintenance windows, and drain respecting PDBs; pause on error-budget burn. Keep at least one previous application version and use backward-compatible migrations. Test cluster autoscaling, image pulls, admission policies, and quota before each major change. All infrastructure and Kubernetes configuration is version-controlled, reviewed, reproducible, and backed up; secrets use Secret Manager/KMS, not Git.\n\n## Observability and SLOs\nCollect load-balancer, application, Kubernetes, database, queue, DNS, and audit logs centrally with retention appropriate to incident response. Metrics include availability, latency (p50/p95/p99), error rate, saturation, pod readiness/restarts, scheduling failures, node/zone capacity, autoscaler activity, DB connections/CPU/storage/replication lag/failover, queue age/depth, and certificate expiry. Trace requests across the gateway and services, propagating a correlation ID.\n\nDefine SLI availability as successful, authorized customer requests; define latency separately (for example, 99% under the product latency target). Use multi-window, multi-burn-rate alerts, paging only for actionable customer impact, and dashboards for regional/zone comparison. Alert on backup failures, DR replica lag, quota/capacity, and security changes. Maintain an error budget and monthly availability report.\n\n## Security affecting availability\nUse least-privilege IAM, separate production access, MFA/short-lived credentials, audited break-glass access, binary/image scanning and signing, admission policy, and regular patching. Encrypt in transit and at rest; rotate certificates/keys with overlap and test restoration. WAF/rate limits protect capacity but have a documented emergency bypass. Ensure IAM, KMS, container registry, DNS, monitoring, and CI/CD have break-glass procedures and regional redundancy. Back up and periodically restore cluster configuration, database, and critical secrets.\n\n## Failure tests and governance\nAt least quarterly, exercise pod/node and single-zone loss, autoscaler/quota exhaustion, database failover, queue backlog, load-balancer backend removal, certificate rotation, and deployment rollback in production-like conditions. At least twice yearly rehearse full regional DR, including promotion, traffic switch, application validation, communications, and failback; measure RTO/RPO and remediate findings. Run game days before major architecture changes.\n\nRisks and accepted trade-offs: regional HA does not protect against regional or provider-wide outages; DR has nonzero data loss and manual steps. Managed database/queue reduce staffing but create vendor and quota dependence and cost. Three-zone spread and spare capacity cost more than packed nodes. Global load balancing, retries, and at-least-once queues can duplicate work, so applications must be idempotent. The 99.95% target excludes neither bad deployments nor dependency failures operationally: both remain platform responsibilities, and error-budget policy controls release risk. Availability depends on tested quotas, DNS/identity/provider services, and disciplined runbooks.\n\nDOC:\n# Highly available GKE platform design\n\n## Goals and assumptions\nThe service target is 99.95% monthly availability (about 22 minutes of unavailability/month), 5,000 requests/s peak, and no operator action for loss of one zone. A regional loss has a documented, rehearsed recovery rather than automatic cross-region continuity. The API/web tiers are stateless; the database and queue are stateful. One continent, three zones, and a managed-service budget with eight engineers are assumed. Availability is measured at the customer-facing endpoint, excluding planned maintenance only where the SLO policy explicitly permits it.\n\n## Topology and capacity\nUse a regional, private GKE Standard cluster in three zones (for example, `us-central1-a/b/c`), with a separate regional production cluster for disaster recovery (DR) in another region on the same continent. Do not run production and DR in the same regional control plane or failure domain.\n\nUse separate node pools for system, general stateless workloads, and any compute-isolated stateful/queue components. Spread at least three replicas across zones with topology spread constraints (`maxSkew: 1`, `DoNotSchedule`), pod anti-affinity, and topology-aware Services. Set requests/limits from load tests and maintain at least 30% spare node/pod capacity; Cluster Autoscaler scales each pool and is bounded by tested quota. A three-zone regional control plane and nodes are zonally redundant, but quotas, images, DNS, and external dependencies must also be multi-zone.\n\nStateless Deployments have at least three replicas (normally more at peak), readiness/startup probes, graceful shutdown, and PodDisruptionBudgets permitting at least one replica to be unavailable while still allowing upgrades. HPA uses CPU plus request-rate/latency custom metrics. Jobs and singleton controllers use leader election. Never use a PDB as a substitute for capacity.\n\n## Traffic and networking\nCloud DNS points to a global external HTTPS load balancer with a managed certificate, Cloud Armor WAF/rate limiting, and health-checked NEGs. The primary region is preferred; the DR backend is enabled/weighted for tested failover. Global load balancing removes an unhealthy regional backend, but DNS/health-check TTLs and existing connections mean failover is not instantaneous. Use connection draining and suitable timeouts/retries, with idempotency keys to prevent duplicate writes.\n\nUse a Shared VPC, private nodes, Private Google Access, Cloud NAT with redundant regional capacity, and VPC firewall rules default-deny. Restrict control-plane access with authorized networks/private endpoint as appropriate. Use NetworkPolicy (default deny, explicit namespace/service paths), separate namespaces and service accounts, and Workload Identity. Reserve IP ranges and quotas for pods/services; monitor NAT ports, conntrack, IP utilization, and load-balancer capacity.\n\n## Data tier\nPrefer a regional managed relational database (for example Cloud SQL HA) with synchronous standby across zones, automatic backups, point-in-time recovery, encryption, maintenance windows, and tested failover. Applications connect through a managed connector/proxy and use bounded pools, backoff, circuit breakers, and transaction timeouts. Database sizing, connection limits, storage, and failover time are load-tested; schema migrations are backward-compatible and separately rolled out. A cross-region read replica or managed cross-region replica is maintained for DR, with documented promotion and an explicitly accepted RPO (for example, 5 minutes) and RTO (for example, 60 minutes).\n\nUse a managed regional message queue with replicated durability and at-least-once semantics. Consumers are idempotent, acknowledge only after durable processing, use dead-letter queues, bounded retries/backoff, and alert on age/lag. Replicate/export queue configuration and define the DR message RPO; do not claim exactly-once delivery.\n\n## Availability and failure behavior\nA zonal node/VM failure causes rescheduling in other zones; a zone outage leaves two zones serving traffic. Health checks remove failed pods/nodes, and autoscaling replenishes capacity. Pod topology rules, sufficient spare capacity, regional database HA, and regional queue durability are prerequisites; verify quota can create replacement nodes in surviving zones. During a zone event, capacity may be reduced and noncritical workloads are shed before customer traffic.\n\nFor a regional outage, declare DR using the runbook: confirm incident, freeze writes/deployments, promote the database replica, validate queue state/configuration, scale the DR cluster, switch load-balancer/DNS traffic, and verify key user journeys. Route only after database promotion and application readiness. Record start/end times and reconcile data after recovery. Target RTO 60 minutes and RPO 5 minutes (business must approve these). Failback is a separate planned change, not an automatic action.\n\n## Upgrades and operations\nUse release channels and a nonproduction environment that mirrors production. Apply GKE/node upgrades progressively: canary pool, one zone at a time, surge upgrades, maintenance windows, and drain respecting PDBs; pause on error-budget burn. Keep at least one previous application version and use backward-compatible migrations. Test cluster autoscaling, image pulls, admission policies, and quota before each major change. All infrastructure and Kubernetes configuration is version-controlled, reviewed, reproducible, and backed up; secrets use Secret Manager/KMS, not Git.\n\n## Observability and SLOs\nCollect load-balancer, application, Kubernetes, database, queue, DNS, and audit logs centrally with retention appropriate to incident response. Metrics include load-balancer and application availability, latency (p50/p95/p99), error rate, saturation, pod readiness/restarts, scheduling failures, node/zone capacity, autoscaler activity, DB connections/CPU/storage/replication lag/failover, queue age/depth, and certificate expiry. Trace requests across the gateway and services, propagating a correlation ID.\n\nDefine SLI availability as successful, authorized customer requests; define latency separately (for example, 99% under the product latency target). Use multi-window, multi-burn-rate alerts, paging only for actionable customer impact, and dashboards for regional/zone comparison. Alert on backup failures, DR replica lag, quota/capacity, and security changes. Maintain an error budget and monthly availability report.\n\n## Security affecting availability\nUse least-privilege IAM, separate production access, MFA/short-lived credentials, audited break-glass access, binary/image scanning and signing, admission policy, and regular patching. Encrypt in transit and at rest; rotate certificates/keys with overlap and test restoration. WAF/rate limits protect capacity but have a documented emergency bypass. Ensure IAM, KMS, container registry, DNS, monitoring, and CI/CD have break-glass procedures and regional redundancy. Back up and periodically restore cluster configuration, database, and critical secrets.\n\n## Failure tests and governance\nAt least quarterly, exercise pod/node and single-zone loss, autoscaler/quota exhaustion, database failover, queue backlog, load-balancer backend removal, certificate rotation, and deployment rollback in production-like conditions. At least twice yearly rehearse full regional DR, including promotion, traffic switch, application validation, communications, and failback; measure RTO/RPO and remediate findings. Run game days before major architecture changes.\n\nRisks and accepted trade-offs: regional HA does not protect against regional or provider-wide outages; DR has nonzero data loss and manual steps. Managed database/queue reduce staffing but create vendor and quota dependence and cost. Three-zone spread and spare capacity cost more than packed nodes. Global load balancing, retries, and at-least-once queues can duplicate work, so applications must be idempotent. The 99.95% target excludes neither bad deployments nor dependency failures operationally: both remain platform responsibilities, and error-budget policy controls release risk. Availability depends on tested quotas, DNS/identity/provider services, and disciplined runbooks.", "meta": "{\"base_version\": 0, \"current\": 1}"}, {"id": 832, "ts": 1795134589.9248364, "kind": "notice", "agent": "ROOM", "reply_to": null, "seen_upto": null, "head": null, "text": "Agent B's document edit was rejected: it was based on version 0 but the current version is 1. Nothing was changed.", "meta": "{}"}, {"id": 833, "ts": 1795134589.9259372, "kind": "ask", "agent": "B", "reply_to": null, "seen_upto": 17, "head": null, "text": "", "meta": "{}"}, {"id": 834, "ts": 1795134589.9267938, "kind": "ask", "agent": "I", "reply_to": null, "seen_upto": 17, "head": null, "text": "", "meta": "{}"}, {"id": 836, "ts": 1795134589.9499831, "kind": "pass", "agent": "G", "reply_to": null, "seen_upto": 15, "head": 17, "text": "", "meta": "{}"}, {"id": 837, "ts": 1795134589.9509602, "kind": "ask", "agent": "G", "reply_to": null, "seen_upto": 17, "head": null, "text": "", "meta": "{}"}, {"id": 839, "ts": 1795134590.7278693, "kind": "pass", "agent": "I", "reply_to": null, "seen_upto": 17, "head": 17, "text": "", "meta": "{}"}, {"id": 841, "ts": 1795134591.5258448, "kind": "message", "agent": "H", "reply_to": null, "seen_upto": 15, "head": 17, "text": "Please review version 1 and post `AGREE v1` if you support it, so we can finalize.", "meta": "{\"stale\": true}"}, {"id": 843, "ts": 1795134591.5275924, "kind": "message", "agent": "B", "reply_to": null, "seen_upto": 17, "head": 18, "text": "AGREE v1", "meta": "{\"stale\": true, \"agree_version\": 1, \"agree_counted\": true}"}, {"id": 844, "ts": 1795134591.5288672, "kind": "ask", "agent": "D", "reply_to": null, "seen_upto": 19, "head": null, "text": "", "meta": "{}"}, {"id": 845, "ts": 1795134591.5297556, "kind": "ask", "agent": "I", "reply_to": null, "seen_upto": 19, "head": null, "text": "", "meta": "{}"}, {"id": 847, "ts": 1795134592.0825446, "kind": "doc_rejected", "agent": "C", "reply_to": null, "seen_upto": null, "head": null, "text": "# Highly Available GKE Platform Design\n\n## 1. Goals and assumptions\n\n- Customer-facing stateless web/API service, relational database, and message queue.\n- Peak load is approximately 5,000 requests/second.\n- Target service availability is **99.95% per calendar month** (approximately 21.9 minutes of error budget), measured at the external load balancer.\n- A single-zone failure must be tolerated without human intervention.\n- A complete regional failure has a documented, rehearsed recovery process; it is not assumed to be fully automatic.\n- The initial deployment serves one continent. Capacity, quotas, and managed-service regional availability must be validated in the selected regions.\n- GKE Standard is selected for node-pool and upgrade control. Managed data services are preferred over self-managed stateful workloads.\n\n## 2. Regional cluster and node topology\n\nThe primary platform is a **three-zone regional, VPC-native GKE Standard cluster**. Nodes use private IP addresses, and the control plane uses a restricted endpoint reachable through approved administrative paths.\n\nUse separate node pools:\n\n1. **System pool**: three or more nodes, distributed across zones, for DNS, metrics, ingress components, and other critical system pods.\n2. **Stateless application pool**: autoscaled across all three zones, with enough reserved headroom to absorb loss of one zone.\n3. **Optional dedicated worker pool**: for consumers or workloads with special CPU/memory/taint requirements. It must not become a single-zone dependency.\n\nUse regional persistent disks only where unavoidable. Stateful database storage is not hosted on ordinary GKE PersistentVolumes.\n\nCluster autoscaling uses per-zone minimums and sufficient maximum capacity for a two-zone degraded operation. Quotas and IP ranges are sized for node surge, pod surge, and the warm-standby region.\n\nA second region contains a warm-standby GKE cluster with replicated manifests, images, policies, configuration, and secrets. It has enough baseline capacity to start the service and a documented scale-up procedure.\n\n## 3. Workload placement and disruption handling\n\nStateless Deployments run at least three replicas, preferably more at peak, with:\n\n- topology spread constraints across `topology.kubernetes.io/zone`;\n- required or preferred pod anti-affinity;\n- appropriate requests and limits;\n- readiness, liveness, and startup probes;\n- graceful termination and connection draining;\n- Horizontal Pod Autoscalers based on CPU plus request/concurrency or custom business metrics;\n- PodDisruptionBudgets that preserve sufficient capacity during voluntary disruption.\n\nCritical components must not all share one node or zone. PDBs are not treated as protection from involuntary zone failure; replica counts and autoscaling provide that protection. Queue consumers are idempotent because delivery can be duplicated.\n\nUse priority classes carefully so system and ingress capacity is retained during resource pressure. Apply resource quotas and limit ranges per namespace. Deployments use rolling updates with `maxUnavailable: 0` where practical and bounded `maxSurge`.\n\n## 4. Traffic entry and regional failover\n\nExternal users reach a global external HTTPS Application Load Balancer with a global anycast address. Cloud Armor provides WAF rules, DDoS controls, and per-client/application rate limits. TLS is terminated with managed certificates; backend connections use TLS where required.\n\nThe load balancer uses health checks that represent actual application readiness, including dependency checks appropriate to the endpoint. It sends traffic to the primary regional cluster and can steer to the warm standby after regional failure. Multi-cluster ingress or an equivalent global backend configuration keeps both regions defined.\n\nA zone failure is handled by regional load balancing and Kubernetes rescheduling without operator action. Regional failover is a runbook-driven operation: confirm the incident, fence or drain the failed primary, promote the database replica, recover the queue, switch write endpoints/configuration, validate health, and direct global traffic to the standby. DNS is not the sole failover mechanism; load-balancer backend changes are preferred for predictable propagation.\n\n## 5. Database and queue\n\n### Relational database\n\nUse a managed PostgreSQL-compatible service such as Cloud SQL:\n\n- regional HA with synchronous standby for zonal failure;\n- automated backups and point-in-time recovery;\n- encryption at rest and in transit;\n- a cross-region replica for disaster recovery;\n- connection pooling and bounded connection counts from applications;\n- schema migrations that are backward compatible and deployed separately from application cutovers.\n\nThe cross-region replica is asynchronously replicated, so the regional-loss target is **RPO no worse than five minutes**, subject to measured replication lag. Regional database promotion is an explicit operation requiring approval (or an automated runbook with a safety gate). Applications use an indirection/configuration mechanism for the active write endpoint.\n\nBackups are stored independently and cross-region. Restore tests verify both data integrity and application compatibility.\n\n### Queue\n\nPrefer a managed regional queue such as Pub/Sub with documented retention, ordering, acknowledgement, retry, and duplicate-delivery semantics. If a broker requiring application-managed ordering is unavoidable, deploy a quorum-based multi-zone service with anti-affinity and tested backup/restore; do not place a single broker in one zone.\n\nFor regional DR, use the provider\u2019s supported replication/export strategy or a second-region queue. Document whether messages are replayed, duplicated, or lost within the RPO. Consumers must be idempotent, use dead-letter handling, and expose oldest-message and processing-lag metrics.\n\n## 6. Failure behavior\n\n### Single-zone loss\n\n- The regional load balancer removes unhealthy backends.\n- Pods in the failed zone are recreated in surviving zones.\n- Autoscaling adds capacity if required, subject to reserved quota/headroom.\n- Cloud SQL regional HA promotes its synchronous standby if necessary.\n- The queue continues through its regional multi-zone service.\n- No operator action is required; alerts open an incident for verification.\n\nCapacity planning must demonstrate that two surviving zones can handle the stated peak or an explicitly documented degraded mode.\n\n### Regional loss\n\nTarget **RTO \u226460 minutes** and **RPO \u22645 minutes**. The runbook covers:\n\n1. Declare regional incident and prevent split-brain writes.\n2. Verify replica lag and promote the cross-region database replica.\n3. Activate/scale the standby GKE workloads.\n4. Update database and queue endpoints, secrets/configuration, and feature flags.\n5. Recover or replay queue messages according to documented semantics.\n6. Shift global load-balancer traffic to the standby.\n7. Run smoke tests, compare key SLIs, and communicate status.\n8. Later, rebuild and resynchronize the failed region before failback.\n\nThis procedure is rehearsed at least quarterly, with measured RTO/RPO and corrective actions.\n\n## 7. Networking and security controls affecting availability\n\nUse a dedicated VPC with regional subnets sized for growth, secondary ranges for pods and services, private nodes, Cloud NAT for controlled egress, and Private Google Access. Restrict control-plane access to administrative networks and identity-aware access paths.\n\nApply Kubernetes NetworkPolicies with default deny between namespaces and explicit DNS, telemetry, database, queue, and egress rules. Use Workload Identity rather than node-wide credentials. Store secrets in a managed secret service, encrypt them with customer-managed keys where required, and replicate them to the standby through controlled automation. Never require manual secret copying during an outage.\n\nUse least-privilege service accounts, image vulnerability scanning/signing, admission policies, regular patching, and Cloud Armor protections. Ensure security controls have tested emergency break-glass procedures so a faulty policy cannot block recovery.\n\n## 8. Upgrades and maintenance\n\nUse release channels and a tested promotion path from nonproduction to standby to primary. Node pools use surge upgrades with sufficient spare capacity. Upgrade one zone or pool segment at a time while observing error rate, latency, eviction, and capacity signals.\n\nRespect PDBs, drain nodes gracefully, and never voluntarily disrupt enough replicas to lose quorum or all serving capacity. Application rollouts are canary or progressive, with automatic rollback on SLO burn or failed health checks. Database engine upgrades, schema changes, and queue changes have separate rollback plans.\n\nMaintenance windows and change freezes protect peak periods. Keep cluster, workload, infrastructure, and policy definitions in version control and reconcile them through approved automation.\n\n## 9. Observability and SLOs\n\nDefine SLIs at the external service boundary:\n\n- availability: successful, non-5xx requests divided by valid requests;\n- latency: percentile latency for key endpoints;\n- queue freshness: oldest unprocessed message and processing lag;\n- database: connection saturation, errors, latency, failover state, backup success, and replica lag.\n\nThe primary SLO is 99.95% monthly availability, with the 21.9-minute error budget. Set latency and queue-freshness objectives appropriate to the application and alert on both fast- and slow-burn error-budget consumption.\n\nCentralize metrics, structured logs, traces, audit logs, load-balancer health, GKE control-plane/node/pod events, autoscaler actions, database health, queue lag, backup status, and cross-region replication lag. Dashboards show zone and region distribution. Alerts are actionable, routed to an on-call rotation, and linked to runbooks.\n\n## 10. Validation and failure testing\n\nAt least quarterly, and after major architecture changes, test:\n\n- zonal evacuation and capacity recovery;\n- node-pool and control-plane upgrades;\n- pod/node disruption and PDB behavior;\n- load-balancer health-check failure;\n- database failover, backup restore, and cross-region promotion;\n- queue outage, duplicate delivery, and replay;\n- secret/configuration replication;\n- complete regional failover and failback.\n\nUse controlled game days, record measured availability, RTO, RPO, data loss, and operator actions, and track remediation to closure. Load tests include at least 5,000 requests/second with a one-zone capacity reduction.\n\n## 11. Risks, assumptions, and trade-offs\n\n- Managed database and queue services reduce operational burden for an eight-engineer team but introduce provider limits, cost, and service-specific replication semantics.\n- Cross-region asynchronous replication cannot guarantee zero data loss; the five-minute RPO is a target that must be monitored and validated.\n- Warm standby costs more than cold DR but materially improves the 60-minute RTO.\n- Global failover can be automated for stateless traffic, but database promotion and write fencing require safeguards against split brain and should have operator approval.\n- 99.95% excludes or includes dependencies only as explicitly defined in the service SLO; provider maintenance and customer-caused failures must be classified consistently.\n- The design assumes regional managed-service availability, sufficient quota, tested application idempotency, and a database workload compatible with Cloud SQL. If those assumptions fail, a separately reviewed architecture (for example, a different managed database) is required.", "meta": "{\"base_version\": 0, \"current\": 1}"}, {"id": 848, "ts": 1795134592.0835369, "kind": "notice", "agent": "ROOM", "reply_to": null, "seen_upto": null, "head": null, "text": "Agent C's document edit was rejected: it was based on version 0 but the current version is 1. Nothing was changed.", "meta": "{}"}, {"id": 849, "ts": 1795134592.0844605, "kind": "ask", "agent": "C", "reply_to": null, "seen_upto": 20, "head": null, "text": "", "meta": "{}"}, {"id": 850, "ts": 1795134592.0852332, "kind": "ask", "agent": "H", "reply_to": null, "seen_upto": 20, "head": null, "text": "", "meta": "{}"}, {"id": 852, "ts": 1795134592.5589085, "kind": "message", "agent": "D", "reply_to": null, "seen_upto": 19, "head": 20, "text": "AGREE v1", "meta": "{\"stale\": true, \"agree_version\": 1, \"agree_counted\": true}"}, {"id": 853, "ts": 1795134592.5606673, "kind": "ask", "agent": "B", "reply_to": null, "seen_upto": 21, "head": null, "text": "", "meta": "{}"}, {"id": 855, "ts": 1795134592.8518758, "kind": "pass", "agent": "G", "reply_to": null, "seen_upto": 17, "head": 21, "text": "", "meta": "{}"}, {"id": 856, "ts": 1795134592.8539524, "kind": "ask", "agent": "G", "reply_to": null, "seen_upto": 21, "head": null, "text": "", "meta": "{}"}, {"id": 858, "ts": 1795134593.0828707, "kind": "message", "agent": "H", "reply_to": null, "seen_upto": 20, "head": 21, "text": "AGREE v1", "meta": "{\"stale\": true, \"agree_version\": 1, \"agree_counted\": true}"}, {"id": 860, "ts": 1795134593.1271796, "kind": "doc_rejected", "agent": "A", "reply_to": null, "seen_upto": null, "head": null, "text": "# Highly Available GKE Platform Design\n\n## 1. Goals and assumptions\n- Customer-facing stateless web/API service, relational database, and message queue; peak 5,000 requests/s, users in one continent.\n- Target is 99.95% monthly availability (about 22 minutes unavailability/month), including planned work where applicable. A single-zone loss must be automatic; region loss has a documented, rehearsed recovery.\n- Use two GCP regions: a **primary** serving region with three zones and a **secondary** warm-standby region with three zones. Select regions near the users but in different failure domains and confirm quota/capacity in advance.\n- Prefer regional GKE Standard clusters (not one cluster stretched across regions). Keep infrastructure and application definitions in Git/IaC and deploy identically to both regions.\n\n## 2. Cluster and node topology\n- One regional, private GKE Standard cluster per region, with control plane replicated by GKE across three zones. Use three zones in the primary; maintain capacity and tested images in the secondary.\n- Separate node pools: (1) system/ingress, (2) general stateless workloads, (3) stateful/queue workloads if self-managed, and (4) optional spot/preemptible pool only for disposable batch work. Use regional managed instance groups, autoscaling, auto-repair, shielded nodes, and surge upgrades.\n- Reserve at least one zone of spare capacity: normal utilization target <=60\u201370% CPU/memory, and autoscaler maximum sufficient for all critical replicas after losing one zone. Use pod requests/limits and quota to prevent noisy neighbors.\n- Use Workload Identity Federation, private nodes and control-plane endpoint, authorized networks/IAP for administration, and VPC-native alias IPs. Do not run production and non-production in the same cluster.\n\n## 3. Workload placement and disruption\n- Stateless Deployments spread across all three zones using required (or carefully weighted) topology spread constraints, anti-affinity, and at least three replicas; HPA on CPU plus request/concurrency metrics. PodDisruptionBudgets allow at most one replica unavailable, but never use PDBs to block emergency node replacement indefinitely.\n- Services have readiness/startup/liveness probes, graceful termination and connection draining. Keep APIs stateless; sessions live in an external replicated store or signed tokens.\n- PriorityClasses reserve scheduling for ingress, API, and critical consumers. Define resource requests, limit ranges, quotas, and graceful shutdown deadlines. Use idempotency and retry budgets to tolerate duplicate delivery.\n- Rollouts use canary/blue-green, maxUnavailable=0 where capacity permits, and automatic rollback on SLO/error-budget violations.\n\n## 4. Traffic entry\n- Global external HTTPS Load Balancer with managed certificates, Cloud Armor (WAF/rate limiting), and Cloud CDN only for explicitly cacheable content. Regional NEGs point to ingress gateways in each cluster.\n- Health checks must test real readiness/dependencies without making destructive calls. Global steering sends traffic to the primary and shifts to the secondary only when synthetic checks and backend health fail; DNS alone is not the failover mechanism.\n- Preserve client IP where needed, enforce TLS from edge to workload, set bounded timeouts/retries, and avoid retry multiplication. Capacity-test the secondary for the expected recovery load.\n\n## 5. Data tier\n- Preferred relational service is regional Cloud SQL HA (primary plus synchronous standby across zones), automated backups, point-in-time recovery, encryption with CMEK where required, and read replicas as needed. Use connection pooling (for example, a bounded pooler) and set database connection limits. HA covers zone failure, not region loss.\n- Establish cross-region asynchronous Cloud SQL replica/backup strategy and a documented promotion procedure. Define RPO (for example, <=5 minutes) and RTO (for example, <=60 minutes) explicitly with the product owner; accept possible recent-data loss during regional disaster. Test promotion and application reconfiguration regularly.\n- Prefer a managed regional/multi-region queue (for example, Pub/Sub) with dead-letter topics, retention, and at-least-once consumers. If a Kafka-like queue is mandatory, run a three-zone regional cluster with replicated storage and separately replicate/restore it in the secondary region. Consumers must be idempotent.\n- Schema migrations are backward-compatible expand/contract changes, run before rollout, and are backed up and rehearsed.\n\n## 6. Failure behavior and recovery\n- Loss of one zone: GKE reschedules pods, regional load balancing removes unhealthy endpoints, autoscaling adds capacity in surviving zones, Cloud SQL HA fails over, and queue replicas continue. Alerts are actionable but no human is required for service recovery.\n- Loss of the primary region: global load balancing shifts to the secondary after health confirmation; promote the database replica, point applications to it via versioned configuration/secret, enable consumers, and validate writes. This runbook is explicitly approved, access-controlled, and rehearsed at least twice yearly. Failback is a separate planned operation.\n- Never automatically promote two database primaries. Use fencing/lease controls and a declared incident authority. Record RPO/RTO, data reconciliation, and customer communication steps.\n\n## 7. Upgrades and maintenance\n- Use GKE release channels with a tested version policy, maintenance windows, surge upgrades, and one-zone-at-a-time disruption. Validate PodDisruptionBudgets and spare capacity before upgrades.\n- Upgrade secondary first, then canary primary, then progressive rollout. Pin and regularly rebuild images; test Kubernetes, ingress, CSI, database, and client compatibility.\n- Apply OS/image and dependency patches under change control; maintain emergency patch procedures. Back up cluster configuration in Git, not mutable cluster state alone.\n\n## 8. Networking\n- Shared VPC with separate subnets/ranges for nodes, pods, and services; secondary ranges sized for autoscaling. Private Google access and Private Service Connect/private endpoints for managed services.\n- Hierarchical firewall policy is default-deny, allowing only required north-south and east-west flows. NetworkPolicies (default deny) restrict namespaces and egress; use Cloud NAT with fixed egress addresses where allowlists require it.\n- Avoid overlapping CIDRs with on-premises/secondary region. Monitor IP exhaustion, NAT ports, load-balancer quotas, and cross-region egress cost/latency.\n\n## 9. Observability and SLOs\n- Define availability as successful, authorized requests excluding client-caused errors; measure globally and per region. Initial SLOs: 99.95% availability, API p95 latency target agreed from baseline, and queue age/DB health objectives. Alert on burn rates (fast and slow), not raw noise.\n- Centralize structured logs, metrics, traces, audit logs, load-balancer/GKE/DB events, and synthetic probes. Dashboards cover zone distribution, replicas/readiness, saturation, autoscaler, errors/latency, DB replication lag/connections, queue backlog/age, and failover state.\n- Page only actionable symptoms; maintain on-call escalation, runbooks, incident timeline, status communication, and postmortems. Track error budget and freeze risky changes when exhausted.\n\n## 10. Security that affects availability\n- Least-privilege IAM, separate deploy/runtime identities, MFA and break-glass accounts tested periodically, organization policies, Binary Authorization/image scanning, secret storage in Secret Manager with rotation, and encrypted data in transit/at rest.\n- Protect management and CI/CD from a regional outage (independent project/account paths). Ensure WAF rules, certificates, DNS/LB ownership, backups, and KMS recovery procedures are documented and tested; a locked-out security control is itself an availability risk.\n\n## 11. Failure testing\n- Quarterly game days inject pod/node failures, zone evacuation, load spikes, dependency latency, DB failover, queue backlog, expired certificate simulation, and broken rollout. At least twice yearly perform a controlled regional recovery and restore from backup.\n- Test from user vantage points, measure actual RTO/RPO and SLO impact, verify fencing/no split brain, and turn findings into tracked remediation. Do not run destructive tests without rollback, approvals, and customer-impact safeguards.\n\n## 12. Risks, trade-offs, and acceptance\n- Two clusters and cross-region data replication increase cost and operational complexity; this is accepted for regional recovery. Warm standby capacity is sized for critical traffic, with reduced noncritical features during disaster.\n- Regional Cloud SQL and asynchronous cross-region replication do not provide zero RPO; accepted RPO/RTO must be signed off. Fully synchronous multi-region writes would add latency and complexity.\n- Managed services reduce staffing burden but create provider/quota/control-plane dependencies; maintain quotas, support plan, portable exports, and restore tests.\n- Availability can be undermined by application bugs, bad migrations, credentials, or global LB misconfiguration; progressive delivery, backups, rollback, and rehearsals mitigate but do not eliminate these risks.\n- Before production: capacity/load test at peak plus one-zone loss, prove dependency quotas, obtain SLO/RPO/RTO sign-off, and complete a regional recovery exercise.\n\nDOC: # Highly Available GKE Platform Design\n\n## 1. Goals and assumptions\n- Customer-facing stateless web/API service, relational database, and message queue; peak 5,000 requests/s, users in one continent.\n- Target is 99.95% monthly availability (about 22 minutes unavailability/month), including planned work where applicable. A single-zone loss must be automatic; region loss has a documented, rehearsed recovery.\n- Use two GCP regions: a **primary** serving region with three zones and a **secondary** warm-standby region with three zones. Select regions near the users but in different failure domains and confirm quota/capacity in advance.\n- Prefer regional GKE Standard clusters (not one cluster stretched across regions). Keep infrastructure and application definitions in Git/IaC and deploy identically to both regions.\n\n## 2. Cluster and node topology\n- One regional, private GKE Standard cluster per region, with control plane replicated by GKE across three zones. Use three zones in the primary; maintain capacity and tested images in the secondary.\n- Separate node pools: (1) the minimum system and application capacity, with autoscaling headroom) and all deployment artifacts. Global external HTTPS Application Load Balancing (multi-cluster/multi-region backend) sends traffic to healthy backends; it normally prefers the primary region.\n\nNode pools are separated as follows:\n\n* Three-zone system pool for GKE/DNS/monitoring/ingress system pods, with dedicated taints/labels and at least three nodes across zones.\n* Stateless application pools, spread across zones, with Cluster Autoscaler and enough reserved headroom that loss of one zone leaves capacity for peak or an explicitly documented degraded rate.\n* Optional isolated jobs or compute pool. Database and queue are not hosted on worker nodes.\n\nUse separate service accounts and least-privilege IAM per workload. Set resource requests/limits, quotas, priority classes, and reservations so noisy or batch workloads cannot evict the API. Autoscaling uses HPA on CPU plus request/concurrency or latency signals where available; node autoscaling has bounded scale-up time and pre-provisioned surge capacity.\n\n## 3. Workload placement and disruption\n\nEvery replicated API/web deployment has topology spread constraints over `topology.kubernetes.io/zone` (and preferably hostname), required anti-affinity where appropriate, and at least three replicas. Critical replicas use a PDB with `maxUnavailable` chosen to preserve service during voluntary disruption; PDBs are not treated as protection from involuntary zone loss. Readiness, startup, and liveness probes are distinct, and termination grace periods plus connection draining are configured.\n\nIngress and application pods are distributed across all zones. Queue consumers scale independently and use graceful shutdown, leases/visibility timeouts, idempotency keys, and dead-letter handling. Database connection pools are bounded and use retry/backoff to avoid a restart storm. Pod priority prevents noncritical jobs from consuming capacity needed by the service.\n\n## 4. Traffic entry and networking\n\nA global external HTTPS Application Load Balancer terminates TLS with managed certificates, applies Cloud Armor WAF/rate limits, and health-checks a deliberately shallow regional readiness endpoint. It routes to the primary cluster and fails over to the standby only when health and policy thresholds are met; health checks do not by themselves promote a database.\n\nWithin each cluster, an internal Gateway/Ingress and Kubernetes Services route to ready pods. Use multi-cluster ingress or equivalent global backend configuration, with explicit failover weights and connection draining. DNS is not the normal failover mechanism, but low-TTL records and documented DNS changes are a fallback.\n\nNodes are private; control-plane authorized access is restricted. Use Cloud NAT for controlled egress, Private Google Access, private service access, firewall rules, and NetworkPolicies (default deny, then explicit service flows). Reserve nonoverlapping pod/service ranges for both regions and size them for autoscaling. Egress dependencies and third-party endpoints have timeouts, retries with jitter, circuit breakers, and regional failure considerations.\n\n## 5. Stateful services\n\nUse Cloud SQL for PostgreSQL (or the selected compatible managed relational service), with regional HA/synchronous standby, automated backups, PITR, encryption, and a cross-region read replica. Applications connect through the managed endpoint/connector, with TLS and credentials in Secret Manager. Backups and WAL are retained cross-region and restore-tested. A promoted cross-region replica is the disaster-recovery database; replication is asynchronous, so committed data can be lost.\n\nUse a managed messaging service such as Pub/Sub rather than a broker in the cluster. Configure retention, dead-letter topics, ordering only where required, delivery-attempt limits, encryption, IAM, and monitoring of oldest-unacked age. The application must tolerate duplicate

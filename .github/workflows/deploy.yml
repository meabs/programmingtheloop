name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Content integrity
        run: npm run check:content
      - name: Content fixture tests
        run: npm run test:content
      - name: Check and build
        run: npm run build
      - name: Internal links
        run: npm run check:links
      - name: Verify custom domain file
        run: test "$(cat dist/CNAME)" = "programmingtheloop.com"
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
  indexnow:
    # Tell Bing and the other IndexNow engines which pages changed. Never blocks or fails the deploy.
    runs-on: ubuntu-latest
    needs: deploy
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
      - name: Submit changed URLs to IndexNow
        env:
          INDEXNOW_WAIT_SECONDS: "90"
        run: node scripts/indexnow.mjs
